<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peça do marcador sob os tokens — prévia externa</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#c9c3b5;font:14px Arial;color:#254886}h1{font-size:18px}.hunt-map{position:relative;width:750px;max-width:100%;height:700px;background-color:#efe9db;background-image:linear-gradient(#25488622 1px,transparent 1px),linear-gradient(90deg,#25488622 1px,transparent 1px);background-size:50px 50px;border:3px double #ed8422;overflow:hidden}.marker-piece{position:absolute;width:350px;height:554px;left:calc(50% - 175px);top:50px}.token{position:absolute;left:calc(50% - 24px);width:48px;height:48px;border:3px solid #254886;border-radius:50%;background:#fff8e5;box-shadow:3px 3px 0 #25488666}.token.feral{top:201px;left:calc(50% + 23px)}.token.monster{top:416px;width:78px;height:78px;left:calc(50% - 39px);border-color:#d3542d}.token img{width:100%;height:100%;border-radius:50%;object-fit:cover}.token span{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding:3px 6px;background:#254886;color:#fff8e5;border-radius:3px;font-size:11px;white-space:nowrap}</style><h1>Marcador de posições · tokens sobre a peça</h1><div class="hunt-map"><img class="marker-piece" src="../../assets/hunt/marcador-posicoes.svg" alt="Faixas de 0 a 4 Pernadas"><div class="token feral"><img src="../../assets/feral.svg" alt=""><span>Lina · 2 Pernadas</span></div><div class="token monster"><img src="../../assets/monster-cute.svg" alt=""><span>Monstro · 0</span></div></div></html>
